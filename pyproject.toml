[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-route"
description = "Sea routes, distances and voyage times as a small HTTP service, built on searoute-py."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "searoute==1.5.0",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "shapely>=2,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
]

[tool.setuptools]
packages = ["sea_route", "sea_route.data"]

[tool.setuptools.package-data]
"sea_route.data" = ["*.geojson"]

[tool.setuptools.dynamic]
version = { attr = "sea_route.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]
