name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    name: docker build and /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: sea-route:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and wait for /health
        run: |
          docker run -d --name sea-route -e SEA_ROUTE_TOKEN=ci -p 5018:5018 sea-route:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5018/health; then echo; exit 0; fi
            sleep 2
          done
          echo "service did not become healthy"; docker logs sea-route; exit 1
      - name: Token is enforced and the README example routes
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5018/ports?q=rotterdam')
          test "$code" = "401"
          curl -fsS -X POST http://127.0.0.1:5018/route \
            -H 'Content-Type: application/json' -H 'X-Sea-Route-Token: ci' \
            -d '{"waypoints":[{"name":"Aliaga","lon":26.933,"lat":38.833},{"name":"Alexandria","lon":29.833,"lat":31.166}],"speed_knots":10}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); nm=d["distance_nm"]; print("distance_nm", nm); assert 526 <= nm <= 548, nm'
      - if: always()
        run: docker rm -f sea-route || true
